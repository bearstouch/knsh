# cargo-deny configuration (NFR-SUP-04). cargo-deny is installed in CI only and is
# never a workspace dependency. Run locally with `cargo deny check` (scripts/check.sh).

[graph]
all-features = true

[advisories]
# Any advisory (vulnerability, unmaintained, unsound) and any yanked version fails.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Licences of the vendored runtime crates. Adding one needs the same review as a new crate.
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.93
# Workspace crates are `publish = false` and carry no licence field yet.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between workspace crates carry no version; they are not wildcards from a registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
