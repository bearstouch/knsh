# Quality gates for every push and pull request (KNSH-001; CLAUDE.md "Toolchain and commands").
# Each step calls scripts/check.sh, so this pipeline and the local script run the same
# commands in the same order. No step is allowed to fail (no `continue-on-error`).
name: CI

on:
  push:
  pull_request:
  # KNSH-109: run the native-mode conformance gate on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  checks:
    name: checks (macOS, Apple silicon)
    # Pinned runner image and Xcode, recorded here as KNSH-001 requires:
    #   runner: macos-15 (arm64, Apple silicon), Xcode 16.4.
    # Bump both deliberately, in a PR of their own.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record platform
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install  # no argument: installs what rust-toolchain.toml names
          rustc --version
          cargo --version

      - name: Install cargo-deny (CI-only tool, never a workspace dependency)
        # Installed from outside the repository so the workspace's offline/vendored
        # cargo configuration does not apply to the tool install.
        working-directory: ${{ runner.temp }}
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo install --locked cargo-deny@0.20.2

      - name: Format
        run: scripts/check.sh fmt

      - name: Lint
        run: scripts/check.sh clippy

      - name: Build (offline, network denied by Seatbelt)
        run: scripts/check.sh build

      - name: Docs
        run: scripts/check.sh doc

      - name: Test
        run: scripts/check.sh test

      - name: Agent-command corpus (normalised, licensed, no raw paths or tokens)
        run: scripts/check.sh corpus

      - name: Parser differential against bash (KNSH-034; 95% exact gate enforced on v* tags)
        run: scripts/check.sh difftest

      - name: Publish parser differential report
        if: always()
        run: |
          if [ -f target/difftest/report.md ]; then
            cat target/difftest/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload parser differential report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-differential-report
          path: target/difftest/report.md
          if-no-files-found: ignore

      - name: Dependency checks (licences, advisories, duplicate versions)
        run: scripts/check.sh deny

  threat-model:
    # KNSH-075 (NFR-SEC-01 – NFR-SEC-10): the threat-model end-to-end suite on every macOS release with a hosted
    # runner. Each run publishes its report (target/threat-model/report.md) to the job summary and as an artefact; the
    # phase 2 release gate references these reports. A release without a hosted runner (macOS 14, whose image GitHub
    # no longer supports: "The configuration 'macos-14-arm64-us-default' is not supported", and macOS 27, at the time
    # of writing) is recorded as pending in tests/threat-model/README.md, never as passed. No DEVELOPER_DIR: the cases
    # trust whichever developer directory the runner selects, as a user's profile would.
    name: threat model (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record platform
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcode-select -p

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version

      - name: Threat-model suite
        run: scripts/check.sh threat-model

      - name: Publish threat-model report
        if: always()
        run: |
          if [ -f target/threat-model/report.md ]; then
            cat target/threat-model/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload threat-model report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: threat-model-report-${{ matrix.runner }}
          path: target/threat-model/report.md
          if-no-files-found: ignore

  conformance:
    # KNSH-109 (NFR-COMPAT-02, NFR-COMPAT-05, NFR-COMPAT-07, NFR-COMPAT-11): native mode against bash 5.2 over the
    # agent-command corpus, the bash-compatible Oils subset and bash's own test suite. It builds bash 5.2.37 and fetches
    # a pinned Oils commit (both checked against their SHA-256 in scripts/conformance.sh), so it runs on every release
    # tag, where the 99% corpus gate is enforced, on pushes to master and on demand; the report is published each time.
    name: native conformance (macOS, Apple silicon)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version

      - name: Conformance gate (99% corpus gate enforced on v* tags)
        run: scripts/conformance.sh

      - name: Publish conformance report
        if: always()
        run: |
          if [ -f target/conformance/report.md ]; then
            cat target/conformance/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-conformance-report
          path: target/conformance/report.md
          if-no-files-found: ignore

  fuzz:
    # KNSH-005 (NFR-SUP-06): a time-boxed smoke run of every fuzz target on every push.
    # Long runs are local (fuzz/README.md). A crash, hang or property failure fails the
    # pipeline, and the crashing inputs are uploaded as an artefact.
    name: fuzz smoke (macOS, Apple silicon)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain (scripts/fuzz.sh)
        run: |
          set -euo pipefail
          toolchain="$(scripts/fuzz.sh --print-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup run "$toolchain" rustc --version

      - name: Install cargo-fuzz (CI-only tool, never a workspace dependency)
        # Installed from outside the repository so the offline/vendored configuration
        # does not apply to the tool install.
        working-directory: ${{ runner.temp }}
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo install --locked cargo-fuzz@0.13.2

      - name: Fuzz every target for 60 s
        run: scripts/fuzz.sh 60

      - name: Fuzz lockfile unchanged (pinned test-only crates)
        run: git diff --exit-code fuzz/Cargo.lock

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
