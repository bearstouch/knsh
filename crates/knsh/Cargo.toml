[package]
name = "knsh"
description = "Shell front end, agent client, shims and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "knsh"
path = "src/main.rs"
# The library carries the docs; documenting a same-named binary too would collide.
doc = false

[dependencies]
knsh-proto = { path = "../knsh-proto" }
knsh-json = { path = "../knsh-json" }

[lints]
workspace = true
