[package]
name = "knsh"
description = "Shell front end, agent client, shims and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "knsh"
path = "src/main.rs"
# The library carries the docs; documenting a same-named binary too would collide.
doc = false

[dependencies]
# Session IDs and timestamps, validated before a request is sent (`knsh forget`, KNSH-017).
knsh-core = { path = "../knsh-core" }
knsh-proto = { path = "../knsh-proto" }
knsh-json = { path = "../knsh-json" }
# Engine paths and the launchd agent for `knsh daemon install` and `uninstall` (KNSH-012). knsh-platform is the
# only route to system calls, so `knsh` itself stays free of `unsafe` and of `libc` (NFR-SUP-02).
knsh-platform = { path = "../knsh-platform" }
# The recording switch in `~/.config/knsh/config.toml` (KNSH-021), read with the engine's own TOML subset parser.
knsh-toml = { path = "../knsh-toml" }

[dev-dependencies]
knsh-platform = { path = "../knsh-platform", features = ["testing"] }

[lints]
workspace = true
