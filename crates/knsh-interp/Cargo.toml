[package]
name = "knsh-interp"
description = "Native bash interpreter: evaluates the knsh-bash syntax tree"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The syntax tree the evaluator walks, consumed unchanged (KNSH-096: no second parser).
knsh-bash = { path = "../knsh-bash" }
# Every process and filesystem effect, behind traits (`CommandSpawner`, `Fs`), so tests run without processes.
knsh-platform = { path = "../knsh-platform" }

[dev-dependencies]
knsh-platform = { path = "../knsh-platform", features = ["testing"] }

# Job control end to end (KNSH-100): its own `main`, so the test binary can also be the interactive shell it drives
# under a pseudo-terminal.
[[test]]
name = "job_control"
harness = false

[lints]
workspace = true
