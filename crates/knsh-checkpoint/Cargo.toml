[package]
name = "knsh-checkpoint"
description = "Checkpoints and best-effort undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
knsh-core = { path = "../knsh-core" }
# The restore journal (KNSH-084) is strict JSON.
knsh-json = { path = "../knsh-json" }
knsh-platform = { path = "../knsh-platform" }

[features]
# In-memory fakes (`knsh_checkpoint::testing`), for other crates' tests only (`[dev-dependencies]`).
testing = []

[dev-dependencies]
# Fakes for the filesystem and volume services (KNSH-078).
knsh-platform = { path = "../knsh-platform", features = ["testing"] }

[lints]
workspace = true

# Phase 3 performance qualification (KNSH-095, NFR-PERF-05, NFR-PERF-06): run with `scripts/qualify-phase3.sh`.
# Its own `main` (no test harness, no third-party bench crate); macOS only.
[[bench]]
name = "phase3"
path = "benches/phase3/main.rs"
harness = false
