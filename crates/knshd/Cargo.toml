[package]
name = "knshd"
description = "Per-user daemon and supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "knshd"
path = "src/main.rs"

[dependencies]
knsh-core = { path = "../knsh-core" }
knsh-json = { path = "../knsh-json" }
knsh-proto = { path = "../knsh-proto" }
knsh-platform = { path = "../knsh-platform" }
knsh-sandbox = { path = "../knsh-sandbox" }
knsh-proxy = { path = "../knsh-proxy" }
knsh-store = { path = "../knsh-store" }
knsh-checkpoint = { path = "../knsh-checkpoint" }
# The hook registrations in the user's configuration file (KNSH-062).
knsh-toml = { path = "../knsh-toml" }

[dev-dependencies]
# Fakes for socket activation, peer credentials and the system log (KNSH-012). Test builds only.
knsh-platform = { path = "../knsh-platform", features = ["testing"] }
# Classified lines for the hook runner tests (KNSH-062). Test builds only.
knsh-bash = { path = "../knsh-bash" }

[lints]
workspace = true
